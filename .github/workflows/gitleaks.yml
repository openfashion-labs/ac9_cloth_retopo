name: gitleaks

on:
  pull_request:
    # edited を含める: squash マージのメッセージは PR タイトル・本文から作られるため、
    # CI 通過後にタイトルを書き換えて検査を回避されないようにする
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 全履歴をスキャンするため深さ制限なしで取得する
          fetch-depth: 0

      - name: Run gitleaks (secret scan)
        # v8.30.1 相当。docker run のダイジェストは Dependabot の追跡対象外なので手動更新
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --verbose

  # コミットメッセージ・author・差分に、ブロック対象の個人情報パターン
  # （Secret: PII_BLOCK_PATTERN に格納された正規表現）が含まれていないか検査する。
  # パターン自体もマッチした内容もログに出さない（公開リポジトリのログは誰でも見えるため）。
  # push (main) でも実行する: squash マージ時にマージ画面でメッセージを直接編集されると
  # PR 上の検査では捕捉できないため、main に入った直後のコミットも検査して検知する
  commit-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commits for blocked personal info
        env:
          BLOCK_PATTERN: ${{ secrets.PII_BLOCK_PATTERN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          # squash マージ時のコミットメッセージは PR タイトル・本文から作られるため、
          # ブランチのコミットだけでなくこれらも検査する
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$BLOCK_PATTERN" ]; then
            # フォークからの PR では Secret が渡らないため検査をスキップする。
            # 外部貢献者は内部の個人情報を知り得ない前提で許容するが、警告として可視化する
            echo "::warning::PII_BLOCK_PATTERN is not available (fork PR?); PII check was skipped."
            exit 0
          fi
          # パターンが不正な正規表現だと grep が exit 2 を返し全チェックが素通りするため、先に検証する
          rc=0
          printf '' | grep -qiE "$BLOCK_PATTERN" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::PII_BLOCK_PATTERN is not a valid extended regex; fix the repository secret."
            exit 1
          fi
          # SHA が解決できないまま進むと rev-list が空になり検査が素通りする（fail-open）ため、
          # 先に検証して fail-closed にする
          if ! git rev-parse --verify --quiet "$HEAD_SHA^{commit}" >/dev/null; then
            echo "::error::HEAD_SHA ($HEAD_SHA) cannot be resolved; failing closed."
            exit 1
          fi
          if git rev-parse --verify --quiet "$BASE_SHA^{commit}" >/dev/null; then
            RANGE="$BASE_SHA..$HEAD_SHA"
            DIFF_OK=1
          else
            # ブランチ新規作成などで base が存在しない場合は HEAD の全履歴を検査する
            # （diff 検査は比較先がないためスキップ）
            RANGE="$HEAD_SHA"
            DIFF_OK=0
          fi
          fail=0
          for c in $(git rev-list "$RANGE"); do
            if git show -s --format='%an %ae %cn %ce %B' "$c" | grep -qiE "$BLOCK_PATTERN"; then
              echo "::error::Commit $c (message or author) matches a blocked personal-info pattern. Reword/reauthor the commit."
              fail=1
            fi
          done
          # 三点 diff + 追加行のみを検査: 過去に漏れた個人情報を「削除する」PR が
          # 削除行へのマッチで落ちてしまわないようにする
          if [ "$DIFF_OK" = 1 ] && git diff "$BASE_SHA"..."$HEAD_SHA" | grep '^+' | grep -qiE "$BLOCK_PATTERN"; then
            echo "::error::The PR diff adds a blocked personal-info pattern. Remove it from the changed files."
            fail=1
          fi
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -qiE "$BLOCK_PATTERN"; then
            echo "::error::The PR title or body matches a blocked personal-info pattern. Edit the PR description."
            fail=1
          fi
          exit $fail
